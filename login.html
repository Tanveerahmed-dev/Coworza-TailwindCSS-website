<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coworza Login</title>

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="icon" type="image/svg" href="coworza.svg">
</head>

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex justify-center items-center p-4 font-inter">

<div class="w-full max-w-6xl bg-white shadow-xl rounded-xl overflow-hidden flex flex-col md:flex-row">

    <!-- LEFT FORM SECTION -->
    <div class="flex-1 p-8 md:p-12 max-w-xl">

        <!-- Toggle Buttons -->
        <div class="flex bg-gray-200 rounded-xl p-1 mb-8">
            <button class="flex-1 py-2 font-semibold rounded-lg">
                Sign Up
            </button>
            <button class="flex-1 py-2 font-semibold text-white bg-orange-500 shadow-md rounded-lg">
                Log In
            </button>
        </div>

        <h1 class="text-4xl font-extrabold text-gray-900">Journey Begins</h1>
        <p class="text-gray-600 mt-2 mb-8">
            Log in with your credentials to access your account
        </p>

        <!-- LOGIN FORM -->
        <form>

            <!-- Email -->
            <div class="mb-5">
                <label class="block font-semibold text-gray-900 mb-1">
                    Email <span class="text-red-500">*</span>
                </label>
                <input type="email"
                       placeholder="you@example.com"
                       class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:ring-2 focus:ring-orange-200 focus:border-orange-500 outline-none">
            </div>

            <!-- Password -->
            <div class="mb-5">
                <label class="block font-semibold text-gray-900 mb-1">
                    Password <span class="text-red-500">*</span>
                </label>

                <div class="relative">
                    <input type="password"
                           placeholder="********"
                           id="password"
                           class="w-full border border-gray-300 rounded-lg px-4 py-3 pr-12 focus:ring-2 focus:ring-orange-200 focus:border-orange-500 outline-none">

                    <!-- Eye Icon -->
                    <span class="absolute right-4 top-1/2 -translate-y-1/2 cursor-pointer text-gray-500" id="togglePassword">
                        <i class="fa-solid fa-eye"></i>
                    </span>
                </div>
            </div>

            <div class="text-right mb-6">
                <a href="#" class="text-orange-500 font-semibold text-sm">Forgot password?</a>
            </div>

            <!-- Sign-in Button -->
            <button
                class="w-full bg-orange-500 hover:bg-orange-600 text-white py-3 rounded-lg text-lg font-bold flex justify-center items-center gap-3">
                <i class="fa-solid fa-arrow-right"></i> Sign In
            </button>

        </form>

        <p class="text-center text-gray-500 text-sm mt-6">
            By continuing, you agree to our
            <a href="#" class="text-orange-500 font-semibold">Privacy Policy</a> and
            <a href="#" class="text-orange-500 font-semibold">Terms of Service</a>.
        </p>

    </div>

    <!-- RIGHT IMAGE SECTION -->
    <div class="flex-1 relative bg-cover bg-center min-h-[300px]"
         style="background-image: url('https://placehold.co/600x800/1f2937/ffffff/png?text=Coworking+Space+View');">

        <!-- Gradient Overlay -->
        <div class="absolute inset-0 bg-gradient-to-t from-black/70 to-transparent"></div>

        <div class="absolute bottom-10 left-10 text-white z-10 max-w-[80%]">

            <span class="inline-flex items-center bg-white/30 px-4 py-1 rounded-full text-sm font-semibold mb-3">
                <i class="fa-solid fa-arrow-right mr-2"></i>
                Member Portal
            </span>

            <h2 class="text-3xl font-extrabold mb-3">Welcome to Coworza</h2>

            <p class="text-white/90 leading-relaxed text-sm">
                Flexible workspaces, premium amenities, and a thriving community designed for productivity.
            </p>

        </div>
    </div>

</div>

<!-- Password Toggle Logic -->
<script>
    const toggle = document.getElementById('togglePassword');
    const password = document.getElementById('password');

    toggle.addEventListener('click', () => {
        const type = password.type === "password" ? "text" : "password";
        password.type = type;
        toggle.innerHTML = type === "password"
            ? '<i class="fa-solid fa-eye"></i>'
            : '<i class="fa-solid fa-eye-slash"></i>';
    });
</script>

</body>
</html>
